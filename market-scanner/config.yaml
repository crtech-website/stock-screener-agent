# Every data source here is free: Massive Basic (stocks), CoinGecko Demo (crypto), SEC EDGAR,
# DefiLlama, Google News RSS, GitHub Actions and Telegram/Discord. The LLM review is optional
# and uses a free tier when turned on.

stocks:
  api_base: https://api.massive.com    # formerly Polygon.io
  calls_per_minute: 5                  # free Basic plan limit
  history_days: 480                    # the free plan serves about two years
  max_backfill_per_run: 120            # first run takes ~25 min; full history after 4-5 runs
  include_delisted: true               # keeps dead stocks in backtests (less survivorship bias)
  min_price: 3
  min_avg_dollar_volume: 5_000_000     # 20-day average of close * volume
  min_market_cap: 50_000_000           # checked only for final candidates
  benchmark: SPY
  # Robinhood: no commission; liquid stocks trade at a gap of a cent or two between buy and sell.
  cost_bps: 10                         # round-trip cost assumed in backtests
  half_spread_pct: 0.05                # buy limit is set this far above the close

crypto:
  calls_per_minute: 30
  history_days: 365                    # Demo plan history limit
  max_backfill_per_run: 100
  min_market_cap: 50_000_000
  min_volume_24h: 5_000_000
  benchmark: bitcoin
  only_symbols_file: robinhood_crypto.txt   # only scan coins your platform sells
  # Robinhood crypto: you buy about 0.95% above the middle price and sell about 0.95% below it
  # (measured Oct 9, 2026 on BTC, ETH, SOL, DOGE, UNI, LINK, STRK, RAY and W).
  cost_bps: 190
  half_spread_pct: 0.95

# Each strategy can override any setting per market under a `stocks:` or `crypto:` key.
# regime: true = only fires while the benchmark is above its 200-day average.
#
# Trade plan for every pick (the backtest tests this exact plan):
#   buy at the signal day's close
#   stop loss   = buy price - stop_atr x ATR      (ATR = average daily price move, 14 days)
#   take profit = buy price + target_atr x ATR, or the target_sma-day average if that is higher
#   hold        = sell at the close after this many days if neither price was hit
strategies:
  oversold_bounce:
    enabled: true
    markets: [stocks, crypto]
    regime: false
    rsi_below: 30
    drop_pct: 15
    drop_bars: 2
    hold: 5
    stop_atr: 2.0
    target_atr: 1.5

  connors_rsi2:
    enabled: true
    markets: [stocks, crypto]
    regime: false
    rsi2_below: 5
    hold: 5
    stop_atr: 2.5
    target_atr: 0.5
    target_sma: 5              # Connors' exit: back above the 5-day average

  ibs_reversion:
    enabled: true
    markets: [stocks]          # needs daily high/low, which the crypto feed lacks
    regime: false
    ibs_below: 0.15
    hold: 3
    stop_atr: 2.0
    target_atr: 1.0

  trend_breakout:
    enabled: true
    markets: [stocks, crypto]
    regime: true
    volume_mult: 1.5
    hold: 20
    stop_atr: 2.0              # Turtle-style 2 ATR stop
    target_atr: 4.0            # aims to win twice what it risks
    stocks: {fast: 50, mid: 150, slow: 200, high_window: 252}
    crypto: {fast: 20, mid: 50, slow: 100, high_window: 55}

  momentum:
    enabled: true
    markets: [stocks, crypto]
    regime: true
    stop_atr: 3.0
    target_atr: 6.0
    stocks: {lookback: 252, skip: 21, top_pct: 0.05, rebalance: monthly, hold: 21}
    crypto: {lookback: 90, skip: 7, top_pct: 0.10, rebalance: weekly, hold: 7}

trading:
  atr_period: 14
  max_stop_pct: 25           # never place a stop more than this % below the buy price
  risk_per_trade_pct: 1      # position size is set so a stop-out loses this % of the account
  max_position_pct: 20       # and never more than this % of the account in one trade
  example_account: 1000      # dollar example shown in each alert

backtest:
  require_edge: false        # true = stay silent for strategies whose backtest doesn't beat the market
  min_t_stat: 2.0
  min_trades: 30

checks:
  candidates_per_strategy: 5
  exclude_sec_severe: true   # bankruptcy, delisting notice, restatement, late filing
  exclude_dilution: false    # recent S-1/S-3/424B offering paperwork
  news_headlines: 5

llm:
  provider: none             # none | groq | gemini | openrouter
  model: openai/gpt-oss-120b # Groq's free model. For Gemini, copy a Flash model id from AI Studio.
  max_reviews: 12
  calls_per_minute: 3        # Groq's free tier allows ~8k tokens/min

alerts:
  picks_per_strategy: 3
  skip_losing_strategies: true  # hold back picks from strategies that lost money in the backtest
  send_when_empty: false
