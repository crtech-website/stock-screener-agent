name: Crypto watch

on:
  schedule:
    # Shortly after each 4-hour candle closes (00, 04, 08, 12, 16, 20 UTC), around the clock.
    - cron: "11 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crypto-watch
  cancel-in-progress: false

defaults:
  run:
    working-directory: market-scanner

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Read the plans the latest crypto scan committed, not the ones current when this run was queued.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-scanner/requirements.txt
      - run: pip install -r requirements.txt
      # Remembers which candle each coin was last checked on, so the same news isn't sent twice.
      - uses: actions/cache/restore@v6
        with:
          path: market-scanner/.cache/monitor
          key: crypto-watch-${{ github.run_id }}
          restore-keys: crypto-watch-
      - run: python -m scanner monitor
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: market-scanner/.cache/monitor
          key: crypto-watch-${{ github.run_id }}
