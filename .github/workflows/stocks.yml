name: Stock scan

on:
  schedule:
    # 22:35 UTC on weekdays is after the US close in both summer and winter time.
    - cron: "35 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write   # to commit the ledger and tonight's picks file

concurrency:
  group: stocks-scan
  cancel-in-progress: false

defaults:
  run:
    working-directory: market-scanner

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          # A queued run must start from the ledger the previous run just committed, not from the
          # commit that was current when it was queued, or its own commit conflicts.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-scanner/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v6
        with:
          path: market-scanner/.cache/stocks
          key: stocks-data-${{ github.run_id }}
          restore-keys: stocks-data-
      - run: python -m scanner scan stocks
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      # Saved even if the scan fails, so a long backfill is never thrown away.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: market-scanner/.cache/stocks
          key: stocks-data-${{ github.run_id }}
      - name: Commit ledger and picks file
        if: always()
        run: |
          mkdir -p ledger
          git config user.name "market-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ledger: stocks $(date -u +%F)"
          # The crypto and stock scans can finish at the same moment; retry if the other one pushed first.
          for i in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then exit 0; fi
            sleep $((i * 10))
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stocks-${{ github.run_id }}
          path: market-scanner/output/
          retention-days: 30
