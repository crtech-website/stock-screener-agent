name: Stock scan

on:
  schedule:
    - cron: "35 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stocks-scan
  cancel-in-progress: false

defaults:
  run:
    working-directory: market-scanner

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-scanner/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: market-scanner/.cache/stocks
          key: stocks-data-${{ github.run_id }}
          restore-keys: stocks-data-
      - run: python -m scanner scan stocks
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: market-scanner/.cache/stocks
          key: stocks-data-${{ github.run_id }}
      - name: Commit ledger
        run: |
          mkdir -p ledger
          git config user.name "market-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/
          git diff --cached --quiet || (git commit -m "Ledger: stocks $(date -u +%F)" && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-${{ github.run_id }}
          path: market-scanner/output/
          retention-days: 30
